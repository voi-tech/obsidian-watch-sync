name: Beta release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Verify tag
        env:
          TAG: ${{ github.ref_name }}
        run: node -e 'const manifest = require("./manifest.json"); if (process.env.TAG !== manifest.version) throw new Error(`Tag ${process.env.TAG} does not match manifest ${manifest.version}`)'
      - run: npm ci
      - run: npm run check
      - name: Attest release assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --prerelease --title "${{ github.ref_name }}" --generate-notes main.js manifest.json styles.css
