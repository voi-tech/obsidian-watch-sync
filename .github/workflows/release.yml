name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Verify tag
        env:
          TAG: ${{ github.ref_name }}
        # A stable tag equals the manifest version; a prerelease tag adds a suffix.
        run: |
          VERSION=$(node -p 'JSON.parse(require("node:fs").readFileSync("manifest.json", "utf8")).version')
          if [ "$TAG" != "$VERSION" ] && [ "${TAG#"$VERSION"-}" = "$TAG" ]; then
            echo "Tag $TAG does not match manifest version $VERSION." >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - name: Attest release assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # CalVer without a suffix ships as a stable release; anything else is a prerelease.
        run: |
          if echo "$TAG" | grep -Eq '^[0-9]{2}\.[0-9]{1,2}\.[0-9]+$'; then
            gh release create "$TAG" --title "$TAG" --generate-notes main.js manifest.json styles.css
          else
            gh release create "$TAG" --prerelease --title "$TAG" --generate-notes main.js manifest.json styles.css
          fi
